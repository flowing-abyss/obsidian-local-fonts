name: E2E

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions: {}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Desktop (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Runs wdio.conf.mts directly (not through `wdio run`), which logs the resolved
      # Obsidian versions via the `if (env['CI'])` block — used as the cache key below,
      # since "latest" can silently point at a different build between runs.
      - name: Get Obsidian cache key
        run: |
          pnpm exec tsx tests/e2e/wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          rm -rf .obsidian-cache

      - name: Cache Obsidian
        uses: actions/cache@v6
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ matrix.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}

      # Linux runners have no display server; Obsidian (Electron) needs one to launch,
      # and some of its features need a window manager on top of the virtual display.
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Set up virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -q herbstluftwm dzen2 x11-xserver-utils

          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1

      - name: Run e2e tests
        run: pnpm run test:e2e
        env:
          # macOS GitHub runners are lower-memory; keep desktop instances modest everywhere.
          WDIO_MAX_INSTANCES: 2

  android:
    strategy:
      fail-fast: false
      matrix:
        obsidian-version: [earliest, latest]
    env:
      AVD_ARGS: '-no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none'
    runs-on: ubuntu-latest
    name: Android (obsidian ${{ matrix.obsidian-version }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Get Obsidian cache key
        run: |
          pnpm exec tsx tests/e2e/wdio.mobile.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          rm -rf .obsidian-cache
        env:
          OBSIDIAN_VERSIONS: ${{ matrix.obsidian-version }}

      - name: Cache Obsidian
        uses: actions/cache@v6
        with:
          path: .obsidian-cache
          key: obsidian-cache-android-${{ hashFiles('obsidian-versions-lock.txt') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-pixel

      - name: Run Android e2e tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          force-avd-creation: false
          avd-name: obsidian_test
          emulator-options: -no-snapshot ${{ env.AVD_ARGS }}
          api-level: 36
          arch: 'x86_64'
          target: google_apis
          profile: pixel
          disk-size: 4096M
          heap-size: 512M
          script: pnpm run test:e2e:android
        env:
          OBSIDIAN_VERSIONS: ${{ matrix.obsidian-version }}

  check:
    if: always()
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check all e2e jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
